apiVersion: argoproj.io/v1alpha1  
kind: Application  
metadata:  
  name: ai-agent  
  namespace: argocd  
spec:  
  project: default  
  source:  
    repoURL: https://github.com/techabdulrahman/ai-k8s-gitops.git  
    targetRevision: main  
    path: apps/ai-agent  
  destination:  
    server: https://kubernetes.default.svc  
    namespace: ai-agent  
  syncPolicy:  
    automated: { prune: true, selfHeal: true }  
