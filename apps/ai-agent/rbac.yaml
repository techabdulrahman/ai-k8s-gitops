apiVersion: v1  
kind: Namespace  
metadata:  
  name: ai-agent  
---  
apiVersion: v1  
kind: ServiceAccount  
metadata:  
  name: ai-agent  
  namespace: ai-agent  
---  
apiVersion: rbac.authorization.k8s.io/v1  
kind: ClusterRole  
metadata:  
  name: ai-agent-readonly  
rules:  
  - apiGroups: [""]  
    resources: ["pods", "pods/log", "events"]  
    verbs: ["get", "list"]  
  - apiGroups: ["apps"]  
    resources: ["deployments", "replicasets"]  
    verbs: ["get", "list"]  
---  
apiVersion: rbac.authorization.k8s.io/v1  
kind: ClusterRoleBinding  
metadata:  
  name: ai-agent-readonly  
roleRef:  
  apiGroup: rbac.authorization.k8s.io  
  kind: ClusterRole  
  name: ai-agent-readonly  
subjects:  
  - kind: ServiceAccount  
    name: ai-agent  
    namespace: ai-agent  
