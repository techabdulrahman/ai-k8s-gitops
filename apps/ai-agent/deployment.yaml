apiVersion: apps/v1  
kind: Deployment  
metadata:  
  name: ai-agent  
  namespace: ai-agent  
spec:  
  replicas: 1  
  selector:  
    matchLabels: { app: ai-agent }  
  template:  
    metadata:  
      labels: { app: ai-agent }  
    spec:  
      serviceAccountName: ai-agent  
      containers:  
        - name: agent  
          image: ghcr.io/techabdulrahman/ai-agent:latest   # built by GitHub Actions (next step)  
          ports: [{ containerPort: 8080 }]  
          envFrom:  
            - secretRef: { name: ai-agent-secrets }  
          readinessProbe:  
            httpGet: { path: /healthz, port: 8080 }  
          resources:  
            requests: { cpu: 100m, memory: 128Mi }  
            limits: { memory: 256Mi }  
---  
apiVersion: v1  
kind: Service  
metadata:  
  name: ai-agent  
  namespace: ai-agent  
spec:  
  selector: { app: ai-agent }  
  ports: [{ port: 80, targetPort: 8080 }]  
