apiVersion: apps/v1  
kind: Deployment  
metadata:  
  name: ai-agent  
  namespace: ai-agent  
spec:  
  replicas: 1  
  selector:  
    matchLabels: { app: ai-agent }  
  template:  
    metadata:  
      labels: { app: ai-agent }  
    spec:  
      serviceAccountName: ai-agent  
      containers:  
        - name: agent  
          image: ghcr.io/techabdulrahman/ai-agent:381c34d63ff698f45c114f5ccf2d6268d0f93f51
          ports: [{ containerPort: 8080 }]  
          envFrom:  
            - secretRef: { name: ai-agent-secrets }  
          env:  
            - name: GEMINI_MODEL  
              value: gemini-3.5-flash-lite  
            - name: GRAFANA_URL  
              value: https://breezysamosa3494.grafana.net  
            - name: POLL_SECONDS  
              value: "60"  
          readinessProbe:  
            httpGet: { path: /healthz, port: 8080 }  
          resources:  
            requests: { cpu: 100m, memory: 128Mi }  
            limits: { memory: 256Mi }  
---  
apiVersion: v1  
kind: Service  
metadata:  
  name: ai-agent  
  namespace: ai-agent  
spec:  
  selector: { app: ai-agent }  
  ports: [{ port: 80, targetPort: 8080 }]  
