apiVersion: apps/v1  
kind: Deployment  
metadata:  
  name: demo-nginx  
  namespace: default  
spec:  
  replicas: 1  
  selector:  
    matchLabels:  
      app: demo-nginx  
  template:  
    metadata:  
      labels:  
        app: demo-nginx  
    spec:  
      containers:  
        - name: nginx  
          image: nginx:doesnotexist
          resources:  
            requests:  
              cpu: 50m  
              memory: 64Mi  
            limits:  
              memory: 128Mi  
