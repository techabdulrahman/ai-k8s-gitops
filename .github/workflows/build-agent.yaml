name: build-ai-agent  

on:  
  push:  
    branches: [main]  
    paths: ["agent/**"]        # only run when agent code changes  
  workflow_dispatch: {}        # lets you run it by hand  

permissions:  
  contents: write              # to commit the new image tag  
  packages: write              # to push to ghcr.io  

jobs:  
  build:  
    runs-on: ubuntu-latest  
    steps:  
      - uses: actions/checkout@v4  

      - name: Log in to GitHub Container Registry  
        uses: docker/login-action@v3  
        with:  
          registry: ghcr.io  
          username: ${{ github.actor }}  
          password: ${{ secrets.GITHUB_TOKEN }}  

      - name: Build and push image  
        uses: docker/build-push-action@v6  
        with:  
          context: agent  
          push: true  
          tags: |  
            ghcr.io/techabdulrahman/ai-agent:${{ github.sha }}  
            ghcr.io/techabdulrahman/ai-agent:latest  

      - name: Update image tag in GitOps manifest  
        run: |  
          sed -i "s|image: ghcr.io/techabdulrahman/ai-agent:.*|image: ghcr.io/techabdulrahman/ai-agent:${GITHUB_SHA}|" apps/ai-agent/deployment.yaml  
          git config user.name  "github-actions"  
          git config user.email "github-actions@users.noreply.github.com"  
          git commit -am "ci: deploy ai-agent ${GITHUB_SHA::7}" || echo "no change"  
          git push  
