name: Deploy Argo CD and AI Agent

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-gke
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GKE_CLUSTER: ${{ vars.GKE_CLUSTER }}
      GKE_LOCATION: ${{ vars.GKE_LOCATION }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
      AI_AGENT_GITHUB_TOKEN: ${{ secrets.AI_AGENT_GITHUB_TOKEN }}
      GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GKE_CLUSTER GKE_LOCATION \
            GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT \
            GEMINI_API_KEY WEBHOOK_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name must be configured in GitHub Actions variables or secrets."
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GKE_LOCATION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Verify Autopilot has a Ready node
        shell: bash
        run: |
          set -euo pipefail
          if ! kubectl get nodes -o wide; then
            echo "::error::Cannot access GKE nodes. Check the cluster and Workload Identity permissions."
            exit 1
          fi
          node_conditions="$(kubectl get nodes -o jsonpath='{range .items[*]}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}')"
          if ! grep -q '^True$' <<< "$node_conditions"; then
            echo "::error::GKE has no Ready nodes. Autopilot must provision capacity before Argo CD or the AI agent can run."
            kubectl get pods -A || true
            exit 1
          fi

      - name: Install Argo CD
        shell: bash
        run: |
          set -euo pipefail
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply --server-side --force-conflicts -n argocd \
            -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.6/manifests/install.yaml
          kubectl wait --for=condition=Established crd/applications.argoproj.io --timeout=180s
          kubectl rollout status deployment/argocd-server -n argocd --timeout=10m
          kubectl rollout status statefulset/argocd-application-controller -n argocd --timeout=10m

      - name: Create agent credentials
        shell: bash
        run: |
          set -euo pipefail
          kubectl create namespace ai-agent --dry-run=client -o yaml | kubectl apply -f -

          secret_args=(
            "--from-literal=GEMINI_API_KEY=${GEMINI_API_KEY}"
            "--from-literal=WEBHOOK_TOKEN=${WEBHOOK_TOKEN}"
          )
          if [[ -n "${AI_AGENT_GITHUB_TOKEN}" ]]; then
            secret_args+=("--from-literal=GITHUB_TOKEN=${AI_AGENT_GITHUB_TOKEN}")
          fi
          if [[ -n "${GRAFANA_TOKEN}" ]]; then
            secret_args+=("--from-literal=GRAFANA_TOKEN=${GRAFANA_TOKEN}")
          fi

          kubectl create secret generic ai-agent-secrets \
            --namespace ai-agent \
            "${secret_args[@]}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Argo CD application
        run: kubectl apply -f argocd/ai-agent-app.yaml

      - name: Wait for AI agent rollout
        shell: bash
        run: |
          set -euo pipefail
          kubectl rollout status deployment/ai-agent -n ai-agent --timeout=10m || {
            kubectl get applications -n argocd
            kubectl get pods -n argocd
            kubectl get pods -n ai-agent
            exit 1
          }
