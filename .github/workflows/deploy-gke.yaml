name: Deploy Argo CD and AI Agent

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-gke
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GKE_CLUSTER: ${{ vars.GKE_CLUSTER }}
      GKE_LOCATION: ${{ vars.GKE_LOCATION }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GKE_CLUSTER GKE_LOCATION \
            GCP_SERVICE_ACCOUNT; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name must be configured in GitHub Actions variables or secrets."
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: projects/807744285814/locations/global/workloadIdentityPools/github-pool/providers/ai-k8s-gitops-provider
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GKE_LOCATION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Ensure agent namespace exists
        shell: bash
        run: |
          set -euo pipefail
          kubectl create namespace ai-agent --dry-run=client -o yaml | kubectl apply -f -

      - name: Install Argo CD
        shell: bash
        run: |
          set -euo pipefail
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply --server-side --force-conflicts -n argocd \
            -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.6/manifests/install.yaml
          kubectl wait --for=condition=Established crd/applications.argoproj.io --timeout=180s
          kubectl rollout status deployment/argocd-server -n argocd --timeout=15m
          kubectl rollout status statefulset/argocd-application-controller -n argocd --timeout=15m

      - name: Apply Argo CD application
        run: |
          kubectl apply -f argocd/ai-agent-app.yaml
          kubectl apply -f argocd/demo-app.yaml

      - name: Wait for AI agent rollout
        shell: bash
        run: |
          set -euo pipefail
          if kubectl get secret ai-agent-secrets -n ai-agent >/dev/null 2>&1; then
            kubectl rollout status deployment/ai-agent -n ai-agent --timeout=15m || {
              kubectl get applications -n argocd
              kubectl get pods -n argocd
              kubectl get pods -n ai-agent
              exit 1
            }
          else
            echo "::warning::Agent Secret is not present. Run the Sync AI Agent Secrets workflow to create it and start the agent."
          fi

      - name: Wait for demo rollout
        run: kubectl rollout status deployment/demo-nginx -n default --timeout=15m
