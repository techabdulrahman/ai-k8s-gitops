name: Sync AI Agent Secrets

on:
  workflow_dispatch:

permissions:
  id-token: write

concurrency:
  group: ai-agent-secrets
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GKE_CLUSTER: ${{ vars.GKE_CLUSTER }}
      GKE_LOCATION: ${{ vars.GKE_LOCATION }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      AI_AGENT_GRAFANA_TOKEN: ${{ secrets.AI_AGENT_GRAFANA_TOKEN }}
      AI_AGENT_GEMINI_API_KEY: ${{ secrets.AI_AGENT_GEMINI_API_KEY }}
      AI_AGENT_WEBHOOK_TOKEN: ${{ secrets.AI_AGENT_WEBHOOK_TOKEN }}
      AI_AGENT_GITHUB_TOKEN: ${{ secrets.AI_AGENT_GITHUB_TOKEN }}

    steps:
      - name: Validate configuration and Grafana token
        shell: bash
        run: |
          set -euo pipefail
          set +x

          for name in GCP_PROJECT_ID GKE_CLUSTER GKE_LOCATION GCP_SERVICE_ACCOUNT \
            AI_AGENT_GRAFANA_TOKEN AI_AGENT_GEMINI_API_KEY AI_AGENT_WEBHOOK_TOKEN; do
            value="${!name}"
            if [[ -z "${value//[[:space:]]/}" ]]; then
              echo "::error::$name must be configured."
              exit 1
            fi
          done

          grafana_token="$(python -c 'import os; print(os.environ["AI_AGENT_GRAFANA_TOKEN"].strip())')"
          gemini_api_key="$(python -c 'import os; print(os.environ["AI_AGENT_GEMINI_API_KEY"].strip())')"
          webhook_token="$(python -c 'import os; print(os.environ["AI_AGENT_WEBHOOK_TOKEN"].strip())')"
          github_token="$(python -c 'import os; print(os.environ.get("AI_AGENT_GITHUB_TOKEN", "").strip())')"

          if [[ "${grafana_token}" != glsa_* ]]; then
            echo "::error::AI_AGENT_GRAFANA_TOKEN must be a Grafana service-account token beginning with glsa_."
            exit 1
          fi

          if ! http_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 30 \
            --header "Authorization: Bearer ${grafana_token}" \
            https://kindcrocus1399.grafana.net/api/alertmanager/grafana/api/v2/alerts)"; then
            echo "::error::Could not connect to the Grafana Alertmanager API."
            exit 1
          fi
          if [[ "${http_status}" != "200" ]]; then
            echo "::error::Grafana token validation returned HTTP ${http_status}."
            exit 1
          fi

          write_env() {
            local name="$1"
            local value="$2"
            local delimiter
            delimiter="$(python -c 'import secrets; print(secrets.token_hex(16))')"
            {
              printf '%s<<%s\n' "${name}" "${delimiter}"
              printf '%s\n' "${value}"
              printf '%s\n' "${delimiter}"
            } >> "${GITHUB_ENV}"
          }
          write_env GRAFANA_TOKEN "${grafana_token}"
          write_env GEMINI_API_KEY "${gemini_api_key}"
          write_env WEBHOOK_TOKEN "${webhook_token}"
          write_env GITHUB_TOKEN "${github_token}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: projects/807744285814/locations/global/workloadIdentityPools/github-pool/providers/ai-k8s-gitops-provider
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GKE_LOCATION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Recreate agent Secret
        shell: bash
        run: |
          set -euo pipefail
          set +x
          kubectl create namespace ai-agent --dry-run=client -o yaml | kubectl apply -f -

          secret_args=(
            "--from-literal=GRAFANA_TOKEN=${GRAFANA_TOKEN}"
            "--from-literal=GEMINI_API_KEY=${GEMINI_API_KEY}"
            "--from-literal=WEBHOOK_TOKEN=${WEBHOOK_TOKEN}"
          )
          if [[ -n "${GITHUB_TOKEN}" ]]; then
            secret_args+=("--from-literal=GITHUB_TOKEN=${GITHUB_TOKEN}")
          fi

          if kubectl get secret ai-agent-secrets -n ai-agent >/dev/null 2>&1; then
            kubectl create secret generic ai-agent-secrets \
              --namespace ai-agent \
              "${secret_args[@]}" \
              --dry-run=client -o yaml | kubectl replace --force -f -
          else
            kubectl create secret generic ai-agent-secrets \
              --namespace ai-agent \
              "${secret_args[@]}"
          fi

      - name: Restart and verify AI agent
        shell: bash
        run: |
          set -euo pipefail
          kubectl wait --for=create deployment/ai-agent -n ai-agent --timeout=10m
          kubectl rollout restart deployment/ai-agent -n ai-agent
          kubectl rollout status deployment/ai-agent -n ai-agent --timeout=15m
